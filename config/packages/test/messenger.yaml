
# framework:
#     messenger:
#         transports:
#             async: 'in-memory://'
#             failed: 'in-memory://'

framework:
    messenger:
        transports:
            async:
                dsn: 'in-memory://'
                retry_strategy:
                    max_retries: 3
                    delay: 0
                    multiplier: 1
                    max_delay: 0
                    jitter: 0

            failed:
                dsn: 'in-memory://'
