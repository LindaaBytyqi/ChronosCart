# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true


    rate_limiter:
        enabled: true

        reserve_api:
            policy: 'fixed_window'
            limit: 10
            interval: '1 minute'

        checkout_api:
            policy: 'fixed_window'
            limit: 5
            interval: '1 minute'
    #esi: true
    #fragments: true
