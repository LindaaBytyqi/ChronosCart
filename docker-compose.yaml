services:
  mysql:
    image: mysql:8.0
    container_name: chronoscart_mysql
    environment:
      MYSQL_ROOT_PASSWORD: karrota
      MYSQL_DATABASE: chronoscart
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pkarrota"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chronoscart_redis
    ports:
      - "6380:6379"

volumes:
  mysql_data: